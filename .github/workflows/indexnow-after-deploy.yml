name: IndexNow after production deploy

on:
  push:
    branches: [main]

concurrency:
  group: indexnow-main
  cancel-in-progress: false

jobs:
  indexnow:
    name: Submit IndexNow URLs
    runs-on: ubuntu-latest
    # Soft-fail the job outcome for visibility, but never block merges/deploys.
    continue-on-error: true
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message || '', '[skip ci]') && !contains(github.event.head_commit.message || '', '[skip indexnow]') }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Keep the push-capable token out of .git/config while dependencies install.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        # No lifecycle scripts: a compromised package cannot run code in this job.
        run: npm ci --ignore-scripts

      - name: Wait for IndexNow key file on production
        env:
          KEY_URL: https://orchestrixlabs.com/68dc675035cd498b963ff03b4a83942f.txt
          EXPECTED: 68dc675035cd498b963ff03b4a83942f
        run: |
          set -e
          for i in $(seq 1 24); do
            code=$(curl -sS -o /tmp/indexnow-key.txt -w "%{http_code}" "$KEY_URL" || echo "000")
            body=$(tr -d '\r\n' </tmp/indexnow-key.txt || true)
            echo "attempt=$i status=$code body_len=${#body}"
            if [ "$code" = "200" ] && [ "$body" = "$EXPECTED" ]; then
              echo "Key file live and exact."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for production key file (IndexNow skipped this run)."
          exit 0

      - name: Submit IndexNow (soft-fail)
        run: node scripts/submit-indexnow.mjs
        # Default script exits 0 even on API failure unless INDEXNOW_STRICT=1

      - name: Persist durable IndexNow state
        run: |
          if git diff --quiet -- scripts/indexnow-state.json; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/indexnow-state.json
          git commit -m "chore: update IndexNow submission state [skip ci]"
          # Token used only for this push (persist-credentials is off).
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
